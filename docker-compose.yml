
services:
  database:
    image: postgres:16-alpine
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${database_name}
      POSTGRES_USER: ${database_user}
      POSTGRES_PASSWORD: ${database_password}
    ports:
      - "28999:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${database_user} -d ${database_name}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  backend:
    mem_limit: 3g
    depends_on:
      database:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - database_url=${database_url}
      - database_user=${database_user}
      - database_password=${database_password}
      - urls=${urls}
      - log_level=${log_level}
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx2g
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    mem_limit: 256m
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "29000:80"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: